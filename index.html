<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur de Moyenne</title>
    <link rel="stylesheet" href="deco.css">
</head>
<body>

    <div class="calculator-card">
        <h2>Calcul de la Moyenne</h2>
        
        <form id="averageForm">
            <div class="input-group">
                <label for="note1">Note 1 (/20) :</label>
                <input type="number" id="note1" step="0.5" min="0" max="20" placeholder="Ex: 14" required>
            </div>

            <div class="input-group">
                <label for="note2">Note 2 (/20) :</label>
                <input type="number" id="note2" step="0.5" min="0" max="20" placeholder="Ex: 12" required>
            </div>

            <div class="input-group">
                <label for="note3">Note 3 (/20) :</label>
                <input type="number" id="note3" step="0.5" min="0" max="20" placeholder="Ex: 15.5" required>
            </div>

            <button type="button" onclick="calculerMoyenne()">Calculer</button>
        </form>

        <div id="resultBox" class="result-box hidden">
            <p>Moyenne : <span id="moyenneValeur">--</span> / 20</p>
            <p id="appreciation" class="appreciation"></p>
        </div>
    </div>

    <script>
        function calculerMoyenne() {
            // Récupération des valeurs des champs
            const note1 = parseFloat(document.getElementById('note1').value);
            const note2 = parseFloat(document.getElementById('note2').value);
            const note3 = parseFloat(document.getElementById('note3').value);

            // Vérification si les champs sont remplis et valides
            if (isNaN(note1) || isNaN(note2) || isNaN(note3)) {
                alert("Veuillez saisir les 3 notes avant de calculer.");
                return;
            }

            if (note1 < 0 || note1 > 20 || note2 < 0 || note2 > 20 || note3 < 0 || note3 > 20) {
                alert("Les notes doivent être comprises entre 0 et 20.");
                return;
            }

            // Calcul de la moyenne
            const moyenne = (note1 + note2 + note3) / 3;
            const moyenneArrondie = moyenne.toFixed(2);

            // Affichage du résultat
            document.getElementById('moyenneValeur').innerText = moyenneArrondie;
            
            const appreciationElem = document.getElementById('appreciation');
            if (moyenne >= 10) {
                appreciationElem.innerText = "Admis(e) !";
                appreciationElem.className = "appreciation success";
            } else {
                appreciationElem.innerText = "Ajourné(e)";
                appreciationElem.className = "appreciation danger";
            }

            // Afficher le bloc de résultat
            document.getElementById('resultBox').classList.remove('hidden');
        }
    </script>

</body>
</html>
